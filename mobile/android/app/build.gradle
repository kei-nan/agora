apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '..'
    // root = file("../")
    //   The folder where the react-native NPM package is. Default is ../node_modules/react-native
    // reactNativeDir = file("../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../node_modules/@react-native/codegen
    // codegenDir = file("../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../node_modules/react-native/cli.js
    // cliFile = file("../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.agora"
    defaultConfig {
        applicationId "com.agora"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    packagingOptions {
        // bcprov-jdk18on and bcutil-jdk18on (both transitive deps of
        // org.jmrtd:jmrtd) bundle identical OSGi manifests at this path.
        resources {
            excludes += ["META-INF/versions/9/OSGI-INF/MANIFEST.MF"]
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // NFC biometric passport chip reading (BAC + raw DG1/DG15/SOD access) —
    // see mobile/android/app/src/main/java/com/agora/nfc/NfcPassportModule.kt.
    //
    // jmrtd 0.8.6 (not the newest 0.8.7, published the same day this was
    // written — picked 0.8.6 for a few months of soak time instead) and
    // scuba-sc-android 0.0.26 both declare a matching transitive dependency
    // on net.sf.scuba:scuba-smartcards:0.0.20 (confirmed by reading both
    // artifacts' POMs on Maven Central), so this pairing is known-consistent.
    // Rarimo's own production Android app (rarime-android-app) pins the
    // older jmrtd 0.7.27 + scuba-sc-android; the jmrtd 0.7->0.8 CHANGELOG
    // (bugfixes + BouncyCastle version bumps only, e.g. DG11/DG12 parsing
    // fixes) shows no breaking changes to the PassportService/BACKey/
    // CardFileInputStream API surface this module uses, so 0.8.6 was chosen
    // over matching Rarimo's exact pin.
    implementation("org.jmrtd:jmrtd:0.8.6")
    implementation("net.sf.scuba:scuba-sc-android:0.0.26")

    // Face match + liveness (mobile/android/app/src/main/java/com/agora/facematch/) —
    // see docs/project/changelog/087.md for why each of these was picked.
    //
    // CameraX: a custom native module instead of react-native-vision-camera
    // (JSI-oriented in v4, New-Architecture-only in v5's Nitro rewrite; this
    // app has newArchEnabled=false). 1.3.4 is a current stable release
    // compatible with this project's compileSdk 34 / minSdk 24.
    implementation("androidx.camera:camera-core:1.3.4")
    implementation("androidx.camera:camera-camera2:1.3.4")
    implementation("androidx.camera:camera-lifecycle:1.3.4")
    implementation("androidx.camera:camera-view:1.3.4")

    // ML Kit Face Detection — the *bundled* model variant
    // (com.google.mlkit:face-detection), not the Play-Services "unbundled"
    // variant (com.google.android.gms:play-services-mlkit-face-detection):
    // keeps liveness detection fully on-device with no dynamic model
    // download or Play Services dependency, consistent with "nothing leaves
    // your phone." ~6.9MB APK size cost, accepted the same way this project
    // already accepts a much larger ZK proving-key footprint elsewhere.
    implementation("com.google.mlkit:face-detection:16.1.7")

    // TensorFlow Lite interpreter for the MobileFaceNet embedding model
    // (mobile/android/app/src/main/assets/mobilefacenet.tflite — see
    // FaceMatchModule.kt's doc comment for the asset's provenance).
    implementation("org.tensorflow:tensorflow-lite:2.17.0")

    // ML Kit Barcode Scanning — QrChallengeModule.kt's decode step for the
    // QR-code alternate liveness challenge (mobile/src/screens/
    // qrLivenessChallenge.ts). Bundled model variant (com.google.mlkit:
    // barcode-scanning), same reasoning as the face-detection dependency
    // above: fully on-device, no Play-Services download, ~2.4MB APK cost
    // accepted the same way.
    implementation("com.google.mlkit:barcode-scanning:17.3.0")

    // Play Integrity API — PlayIntegrityModule.kt's device/app-integrity
    // attestation (mobile/src/chain/deviceIntegrity.ts). The standalone
    // "integrity" artifact, not the older/deprecated "com.google.android.
    // play:core" bundle that used to include this alongside unrelated Play
    // Core features (in-app review, app updates, asset delivery) — Google's
    // current recommended dependency for this API specifically.
    implementation("com.google.android.play:integrity:1.6.0")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle"); applyNativeModulesAppBuildGradle(project)
