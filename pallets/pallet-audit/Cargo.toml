[package]
name = "pallet-audit"
description = "Audit Office — hooks into treasury expenditures, tracks audit status, and manages auditors for Agora."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
frame-support.workspace = true
frame-system.workspace = true
scale-info = { features = ["derive"], workspace = true }
sp-runtime.workspace = true
pallet-treasury-ledger = { path = "../pallet-treasury-ledger", default-features = false }
pallet-accountability-council = { path = "../pallet-accountability-council", default-features = false }

[dev-dependencies]
sp-core = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
sp-runtime = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-runtime/std",
    "pallet-treasury-ledger/std",
    "pallet-accountability-council/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "sp-runtime/try-runtime",
    "pallet-treasury-ledger/try-runtime",
    "pallet-accountability-council/try-runtime",
]
