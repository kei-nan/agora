[package]
name = "pallet-identity-zk"
description = "ZK passport verification and citizen registry for Agora."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
ark-bn254.workspace = true
ark-ff.workspace = true
codec = { features = ["derive"], workspace = true }
frame-support.workspace = true
frame-system.workspace = true
hex = { version = "0.4", default-features = false, features = ["alloc"] }
poseidon2-bn254.workspace = true
scale-info = { features = ["derive"], workspace = true }
sp-runtime.workspace = true

[dev-dependencies]
# Used only by this pallet's mock runtime, to test `EmergencyRotationOrigin` against the real
# `pallet_emergency_council::EnsureActiveEmergency` origin rather than a hand-rolled stand-in —
# see `src/mock.rs` and the `emergency_rotate_oprf_scheme_*` tests in `src/tests.rs`.
pallet-emergency-council = { default-features = true, workspace = true }
# Backs `Config::Currency` in the mock runtime (real `Currency<AccountId>`, not a stub) so
# `recover_account`'s `RecoveryBlockedNonzeroBalance` guard is tested against genuine balance
# storage — same idiom `pallet-courts`' own mock already uses for its `Config::Currency`.
pallet-balances = { default-features = true, workspace = true }
sp-core = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
sp-runtime = { default-features = true, workspace = true }

[features]
default = ["std"]
std = [
    "ark-bn254/std",
    "ark-ff/std",
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "hex/std",
    "poseidon2-bn254/std",
    "scale-info/std",
    "sp-runtime/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
    "sp-runtime/try-runtime",
]
