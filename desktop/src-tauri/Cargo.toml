[workspace]

[package]
name = "agora-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "agora_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "agora-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
twox-hash = "1.6"
hex = "0.4"
bs58 = "0.5"
# Recomputes the SHA-256 digest of fetched IPFS content in fetch_ipfs_content (chain.rs) so it
# can be checked against the on-chain hash the CIDv0 was derived from before the content is
# trusted and returned to the frontend — an IPFS gateway is not itself a trust boundary.
sha2 = "0.10"
# Lets fetch_ipfs_content enforce a response-size cap while streaming the gateway response,
# instead of buffering an attacker-controlled Content-Length fully into memory first.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# Verifies the sr25519 signatures the mobile app actually produces (`getSigningKeypair()` in
# mobile/src/chain/identity.ts uses an sr25519 `@polkadot/keyring` KeyringPair) — see
# commands/auth.rs's QR-auth callback signature verification.
schnorrkel = "0.11"
# RediSearch's vector-search commands (FT.CREATE/FT.SEARCH) are issued over Redis's native RESP
# wire protocol, not HTTP — reqwest (already a dependency, used by chain.rs/agent.rs) can't speak
# it. See vector_search.rs's module doc comment for the full reasoning. tokio-comp wires it to
# this crate's existing tokio runtime rather than pulling in a second async runtime.
redis = { version = "0.27", features = ["tokio-comp"] }
# Makes VectorSearchClient (vector_search.rs) dyn-compatible — native async-fn-in-trait can't
# back a `Box<dyn Trait>` without this. See the trait's doc comment for why dyn was chosen over
# compile-time generics here.
async-trait = "0.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
